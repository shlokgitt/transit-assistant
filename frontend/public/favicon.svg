<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded pill -->
  <rect width="64" height="64" rx="16" fill="#0b1329" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Transit metro / route icon -->
  <path d="M18 20C18 16.6863 20.6863 14 24 14H40C43.3137 14 46 16.6863 46 20V38C46 41.3137 43.3137 44 40 44H24C20.6863 44 18 41.3137 18 38V20Z" fill="#131e3d" stroke="url(#brandGrad)" stroke-width="2.5" />
  
  <!-- Windows -->
  <rect x="22" y="18" width="20" height="10" rx="3" fill="#06b6d4" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
  
  <!-- Headlights -->
  <circle cx="24" cy="35" r="2.5" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="40" cy="35" r="2.5" fill="#f59e0b" filter="url(#glow)" />
  
  <!-- Wheel struts -->
  <path d="M22 44L17 50M42 44L47 50" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  <path d="M15 50H49" stroke="#334155" stroke-width="2" stroke-linecap="round" />
</svg>
