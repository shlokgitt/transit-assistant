# Base directory is `frontend` (set in Netlify UI). The API routes import
# ../route.js and ../metro-fares.js from the repo root, which depend on
# packages in the root package.json, so install those before building.
[build]
  command = "npm install --prefix .. --omit=dev --no-audit --no-fund && npm run build"
  publish = ".next"

# Next.js runtime: turns the .next output into Netlify Functions/Edge Functions
# so pages and API routes are served. Without it the site returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
